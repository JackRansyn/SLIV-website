# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: JackRansyn/SLIV-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/20cd04c3-d239-479b-aa3b-49cd21c4c0da/pkce
  auth_token_endpoint: /sites/20cd04c3-d239-479b-aa3b-49cd21c4c0da/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://marvelous-centaur-3887c6.netlify.app

# Elke wijziging komt eerst als concept binnen (Draft) en moet je goedkeuren
# (Ready) voordat 'ie live gaat (Published). Zichtbaar in het "Editorial workflow"-
# tabblad bovenin de CMS.
publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "nieuws"
    label: "Nieuwsberichten"
    label_singular: "Nieuwsbericht"
    folder: "content/nieuws"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Samenvatting", name: "excerpt", widget: "text", hint: "Kort, 1-2 zinnen. Verschijnt in het overzicht en de RSS-feed." }
      - { label: "Inhoud", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "nieuws-item.njk" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: "nieuws/{{ page.fileSlug }}/index.html" }

  - name: "werkgroepen"
    label: "Werkgroepen"
    label_singular: "Werkgroep"
    folder: "content/werkgroepen"
    create: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Afkorting (badge)", name: "tag", widget: "string" }
      - { label: "Romeins cijfer", name: "romeins", widget: "string" }
      - { label: "Volgnummer", name: "volgnummer", widget: "number" }
      - { label: "Permalink", name: "permalink", widget: "hidden", default: false }
      - { label: "Omschrijving", name: "body", widget: "markdown" }
